# Sandbox services for manual checks, generated per worktree from
# dev/worktree.json by the workstation's worktree setup script, which fills in
# the double-brace placeholders. The test suites do not use this file: database
# tests start their own Postgres through testcontainers.
name: {{COMPOSE_PROJECT}}

services:
  postgres:
    image: postgres:16-alpine
    container_name: {{COMPOSE_PROJECT}}-postgres
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden-dev-only
      POSTGRES_DB: warden
    ports:
      - "127.0.0.1:{{PORT_POSTGRES}}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # The live syslog collector from tests/syslogfwd/live, for
  # tests/syslogfwd/test_syslog_live.py. Started only with --profile syslog.
  # Write its certificates first:
  #   python tests/syslogfwd/live/make_certs.py {{SANDBOX_POSIX}}/certs
  # Received messages land in {{SANDBOX_POSIX}}/syslog-out.
  syslog:
    profiles: ["syslog"]
    build: {{WORKTREE_POSIX}}/tests/syslogfwd/live
    image: {{COMPOSE_PROJECT}}-syslog
    container_name: {{COMPOSE_PROJECT}}-syslog
    ports:
      - "127.0.0.1:{{PORT_SYSLOG}}:5514/udp"
      - "127.0.0.1:{{PORT_SYSLOG}}:5514/tcp"
      - "127.0.0.1:{{PORT_SYSLOG_TLS}}:6514/tcp"
    volumes:
      - "{{SANDBOX_POSIX}}/certs:/certs:ro"
      - "{{SANDBOX_POSIX}}/syslog-out:/var/log/remote"

  # The stub OIDC provider (navikt mock-oauth2-server, MIT) for the live single
  # sign-on check, tests/identity/sso/test_sso_live.py, over TLS with issuer
  # https://localhost:{{PORT_STUB_IDP}}/warden. Started only with --profile idp.
  # Write its keystore first:
  #   python tests/identity/sso/live/make_certs.py {{SANDBOX_POSIX}}/idp-certs
  idp:
    profiles: ["idp"]
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    container_name: {{COMPOSE_PROJECT}}-idp
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    ports:
      - "127.0.0.1:{{PORT_STUB_IDP}}:8080"
    volumes:
      - "{{WORKTREE_POSIX}}/tests/identity/sso/live/config.json:/config/config.json:ro"
      - "{{SANDBOX_POSIX}}/idp-certs:/certs:ro"

volumes:
  pgdata:
