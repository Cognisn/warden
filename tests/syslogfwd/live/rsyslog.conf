# Plain UDP and TCP on 5514, TLS on 6514. Each input writes its own file
# under /var/log/remote, one line per received message, so the live check
# can count frames and read MSGID and structured data as the collector saw them.
global(workDirectory="/var/lib/rsyslog" maxMessageSize="64k")

module(load="imudp")
module(load="imtcp" maxSessions="50")

template(name="received" type="string"
         string="%msgid% %structured-data% %msg%\n")

ruleset(name="udp") { action(type="omfile" file="/var/log/remote/udp.log" template="received") }
ruleset(name="tcp") { action(type="omfile" file="/var/log/remote/tcp.log" template="received") }
ruleset(name="tls") { action(type="omfile" file="/var/log/remote/tls.log" template="received") }

input(type="imudp" port="5514" ruleset="udp")
input(type="imtcp" port="5514" ruleset="tcp")
input(type="imtcp" port="6514" ruleset="tls"
      streamDriver.name="gtls" streamDriver.mode="1" streamDriver.authMode="anon"
      streamDriver.CAFile="/certs/ca.pem"
      streamDriver.CertFile="/certs/server.pem"
      streamDriver.KeyFile="/certs/server.key")
