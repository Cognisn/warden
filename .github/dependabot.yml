# Keeps the commit SHAs that pin every GitHub Action current. Dependabot keeps
# the pinned form (full SHA, release as a trailing comment), which the
# pinned-actions tripwire accepts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Updates target the open release branch, never main, which holds only
    # released versions. Retarget this at each release branch cut (see
    # docs/releasing.md).
    target-branch: release/v0.1.1
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
